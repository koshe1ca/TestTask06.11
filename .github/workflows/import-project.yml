name: Import Semantic TextNavigator source
on:
  push:
    branches: [main]
    paths:
      - '.bundle/part05.txt'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack complete source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bundle/part*.txt | base64 --decode > /tmp/semantic-textnavigator.tar.xz
          tar -xJf /tmp/semantic-textnavigator.tar.xz --strip-components=1
          rm -rf .bundle
          python3 -m unittest discover -s tests -v
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import complete Semantic TextNavigator application"
            git push
          fi
